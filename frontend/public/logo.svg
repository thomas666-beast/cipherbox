<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Hexagon shield -->
  <path d="M40 6 L68 22 L68 54 L40 70 L12 54 L12 22 Z" 
        stroke="#10b981" stroke-width="2.5" stroke-linejoin="round" fill="none"/>
  <!-- Broken vertex (subtle crack) -->
  <path d="M40 6 L34 14 L40 16 L46 14 Z" fill="#030712"/>
  <!-- > prompt -->
  <path d="M28 34 L38 40 L28 46" 
        stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- _ cursor -->
  <rect x="42" y="44" width="10" height="2.5" fill="#10b981"/>
  
  <!-- Wordmark (brighter white for dark backgrounds) -->
  <text x="88" y="50" font-family="'SF Mono', 'Menlo', 'Consolas', monospace" 
        font-size="28" font-weight="600" fill="#ffffff">
    cipherbox
  </text>
  <!-- Pulsing cursor after wordmark -->
  <rect x="290" y="32" width="3" height="20" fill="#10b981">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
